name: studio-game

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: studio-game-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
      - MSSQL_SA_PASSWORD=Studio#Game2026
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Studio#Game2026" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: studio-game-migrate
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./sql:/sql:ro
    entrypoint: >
      bash -c 'for f in /sql/*.sql; do
      echo ">> $$f";
      /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "Studio#Game2026" -C -b -i "$$f" || exit 1;
      done'

volumes:
  mssql_data:
